name: Buduj APK (Kosmiczny Górnik)

# APK budowany jest automatycznie po każdej zmianie w folderze game/
# albo ręcznie: zakładka Actions -> "Buduj APK" -> "Run workflow".
# Gotowy plik .apk pobierzesz z sekcji "Artifacts" danego uruchomienia.

on:
  workflow_dispatch:
  push:
    paths:
      - 'game/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Javę 21
        # Capacitor 8 / Android Gradle Plugin 8.13 wymagają Javy 21 (nie 17).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Zainstaluj Node.js
        # Capacitor 8 CLI i część wtyczek (AdMob 8, Play Games) wymagają Node >=22.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Przygotuj Android SDK (platformy/licencje na bieżąco)
        uses: android-actions/setup-android@v3

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir -p apk-build/www
          cp -r game/* apk-build/www/
          cd apk-build
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/local-notifications@8 @capacitor-community/admob@8 @idleflowgames/capacitor-play-games@8
          npx cap init "Kosmiczny Gornik" "com.mrt.kosmicznygornik" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Skonfiguruj AdMob (App ID w AndroidManifest.xml)
        # Testowe App ID Google (bezpieczne do budowania/testowania) — przed
        # publikacją podmień razem z ID w game/js/ads.js na własne z AdMob.
        # Zgodnie z dokumentacją wtyczki: meta-data w AndroidManifest.xml
        # odwołuje się do zasobu string (a nie wpisuje ID wprost).
        run: |
          python3 - <<'PYEOF'
          import re
          manifest_path = "apk-build/android/app/src/main/AndroidManifest.xml"
          strings_path = "apk-build/android/app/src/main/res/values/strings.xml"

          with open(manifest_path) as f:
              xml = f.read()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n'
          xml = re.sub(r'(<application[^>]*>)', r'\1\n' + meta, xml, count=1)
          with open(manifest_path, "w") as f:
              f.write(xml)

          with open(strings_path) as f:
              strings = f.read()
          entry = '    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n'
          strings = strings.replace('</resources>', entry + '</resources>')
          with open(strings_path, "w") as f:
              f.write(strings)
          PYEOF

      - name: Skonfiguruj Google Play Games Services
        # PLACEHOLDER project ID — Play Games (w przeciwieństwie do AdMob) nie ma
        # bezpiecznego "testowego" ID, logowanie nie zadziała dopóki nie podmienisz
        # tego na prawdziwy numer projektu z Google Play Console (patrz README.md,
        # sekcja „Google Play Games Services"). Do tego czasu wtyczka po prostu
        # nie loguje gracza — gra działa normalnie, bez błędów.
        run: |
          python3 - <<'PYEOF'
          import re
          manifest_path = "apk-build/android/app/src/main/AndroidManifest.xml"
          games_ids_path = "apk-build/android/app/src/main/res/values/games-ids.xml"

          with open(manifest_path) as f:
              xml = f.read()
          meta = '        <meta-data android:name="com.google.android.gms.games.APP_ID" android:value="@string/game_services_project_id"/>\n'
          xml = re.sub(r'(<application[^>]*>)', r'\1\n' + meta, xml, count=1)
          with open(manifest_path, "w") as f:
              f.write(xml)

          with open(games_ids_path, "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                      '    <string name="game_services_project_id" translatable="false">000000000000</string>\n'
                      '</resources>\n')
          PYEOF

      - name: Wygeneruj ikonę aplikacji na Androida
        run: |
          mkdir -p apk-build/assets
          cp store-assets/icon-src/icon.png apk-build/assets/icon.png
          cp store-assets/icon-src/icon-foreground.png apk-build/assets/icon-foreground.png
          cp store-assets/icon-src/icon-background.png apk-build/assets/icon-background.png
          cd apk-build
          npm install @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Zbuduj APK (debug)
        run: |
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: kosmiczny-gornik-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
