name: Buduj APK (Kosmiczny Górnik)

# APK budowany jest automatycznie po każdej zmianie w folderze game/
# albo ręcznie: zakładka Actions -> "Buduj APK" -> "Run workflow".
# Gotowy plik .apk pobierzesz z sekcji "Artifacts" danego uruchomienia.

on:
  workflow_dispatch:
  push:
    paths:
      - 'game/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Javę 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Przygotuj projekt Capacitor
        run: |
          mkdir -p apk-build/www
          cp -r game/* apk-build/www/
          cd apk-build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Kosmiczny Gornik" "com.mrt.kosmicznygornik" --web-dir=www
          npx cap add android

      - name: Zbuduj APK (debug)
        run: |
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: kosmiczny-gornik-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
