<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1026" />
<title>Kosmiczny Górnik</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="milkyway"></div>
<div class="stars" id="stars"></div>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<div class="bgPlanet p1"></div>
<div class="bgPlanet p2"></div>

<div id="splash">
  <div class="splashAst">🪨</div>
  <h1>💎 KOSMICZNY<br>GÓRNIK</h1>
  <p class="tagline">Wydobywaj kryształy. Podbij galaktykę.</p>
  <p class="tapHint">▶ Dotknij, aby grać</p>
</div>

<button id="soundBtn" title="Dźwięk wł./wył.">🔊</button>

<header>
  <div id="crystalCount">0 <span class="unit">💎</span></div>
  <div id="cpsLabel">0 / sek.</div>
  <div id="stardustLabel"></div>
  <div id="boostBar"></div>
</header>

<div id="tapArea">
  <div id="astGlow"></div>
  <div id="orbitRing"><span>💎</span><span>✦</span><span>💎</span></div>
  <div id="asteroid"><!-- kształt SVG generuje asteroid.js (per skórka) --></div>
</div>

<div id="comet">☄️</div>

<div id="coach" style="display:none">
  <span id="coachText"></span>
  <button id="coachBtn">✖</button>
</div>

<nav>
  <button data-tab="mine" class="active"><span class="ico">⛏️</span>Kopalnia</button>
  <button data-tab="upgrades"><span class="ico">🚀</span>Ulepszenia</button>
  <button data-tab="exp"><span class="ico">🛰️</span>Baza</button>
  <button data-tab="prestige"><span class="ico">✨</span>Prestiż</button>
  <button data-tab="achv"><span class="ico">🏆</span>Sukcesy</button>
  <button data-tab="bonus"><span class="ico">🎁</span>Bonusy</button>
</nav>
<div id="panel"></div>

<div id="overlay"><div class="box" id="overlayBox"></div></div>
<div id="toast"></div>

<!-- Kolejność ma znaczenie: config -> state -> logic -> sound -> asteroid -> ads -> ui -> main -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/logic.js"></script>
<script src="js/sound.js"></script>
<script src="js/asteroid.js"></script>
<script src="js/icons.js"></script>
<script src="js/ads.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
