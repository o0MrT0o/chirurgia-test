<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1026" />
<title>Kosmiczny Górnik</title>
<link rel="icon" href="icon.png" type="image/png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="skyCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<div id="loader">
  <img class="introPlanet" src="assets/space/jupiter.png" alt="">
  <div class="introStars">
    <i style="left:14%;top:20%;width:3px;height:3px;animation-delay:.2s"></i>
    <i style="left:82%;top:16%;width:2px;height:2px;animation-delay:.6s"></i>
    <i style="left:88%;top:34%;width:3px;height:3px;animation-delay:1.1s"></i>
    <i style="left:10%;top:62%;width:2px;height:2px;animation-delay:.4s"></i>
    <i style="left:22%;top:78%;width:3px;height:3px;animation-delay:1.4s"></i>
    <i style="left:76%;top:70%;width:2px;height:2px;animation-delay:.8s"></i>
  </div>
  <img class="loaderAst" src="icon.png" alt="">
  <h1>KOSMICZNY<br>GÓRNIK</h1>
  <div class="loaderBarWrap"><div class="loaderBar" id="loaderBar"></div></div>
  <p class="loaderTip" id="loaderTip">Uruchamianie kopalni…</p>
</div>

<div id="splash">
  <img class="introPlanet" src="assets/space/jupiter.png" alt="">
  <div class="introStars">
    <i style="left:14%;top:20%;width:3px;height:3px;animation-delay:.2s"></i>
    <i style="left:82%;top:16%;width:2px;height:2px;animation-delay:.6s"></i>
    <i style="left:88%;top:34%;width:3px;height:3px;animation-delay:1.1s"></i>
    <i style="left:10%;top:62%;width:2px;height:2px;animation-delay:.4s"></i>
    <i style="left:22%;top:78%;width:3px;height:3px;animation-delay:1.4s"></i>
    <i style="left:76%;top:70%;width:2px;height:2px;animation-delay:.8s"></i>
  </div>
  <img class="splashAst" src="icon.png" alt="">
  <h1>KOSMICZNY<br>GÓRNIK</h1>
  <p class="tagline">Wydobywaj kryształy. Podbij galaktykę.</p>
  <p class="tapHint">▶ Dotknij, aby grać</p>
</div>

<button id="settingsBtn" title="Ustawienia">⚙️</button>

<header>
  <div id="crystalCount">0 <span class="unit">💎</span></div>
  <div id="cpsLabel">0 / sek.</div>
  <div id="stardustLabel"></div>
  <div id="goalBar"></div>
  <div id="boostBar"></div>
</header>

<div id="tapArea">
  <div id="zonePlate"></div>
  <div id="astGlow"></div>
  <div id="orbitRing"><span>💎</span><span>✦</span><span>💎</span></div>
  <div id="comboMeter"><span id="comboText"></span><div class="comboBar"><div id="comboFill"></div></div></div>
  <div id="asteroid"><!-- kształt SVG generuje asteroid.js (per skórka) --></div>
</div>

<div id="comet">☄️</div>

<div id="coach" style="display:none">
  <span id="coachText"></span>
  <button id="coachBtn">✖</button>
</div>

<nav>
  <button data-tab="mine" class="active"><span class="ico"><img class="navSprite" src="assets/upgrades/pickaxe.png" alt="⛏️" decoding="async"></span>Kopalnia</button>
  <button data-tab="upgrades"><span class="ico"><img class="navSprite" src="assets/buildings/ship.png" alt="🚀" decoding="async"></span>Ulepszenia</button>
  <button data-tab="exp"><span class="ico"><img class="navSprite" src="assets/buildings/station.png" alt="🛰️" decoding="async"></span>Baza</button>
  <button data-tab="prestige"><span class="ico"><img class="navSprite" src="assets/wheel/dust.png" alt="✨" decoding="async"></span>Prestiż</button>
  <button data-tab="achv"><span class="ico"><img class="navSprite" src="assets/achievements/medal4.png" alt="🏆" decoding="async"></span>Sukcesy</button>
  <button data-tab="bonus"><span class="ico"><img class="navSprite" src="assets/nav/present.png" alt="🎁" decoding="async"></span>Bonusy</button>
</nav>
<div id="panel"></div>

<div id="overlay"><div class="box" id="overlayBox"></div></div>
<div id="toast"></div>

<!-- Kolejność ma znaczenie: i18n -> config -> state -> logic -> sound -> music -> asteroid -> ads -> playgames -> ui -> main -->
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/logic.js"></script>
<script src="js/sound.js"></script>
<script src="js/music.js"></script>
<script src="js/asteroid.js"></script>
<script src="js/space.js"></script>
<script src="js/notify.js"></script>
<script src="js/ads.js"></script>
<script src="js/playgames.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
